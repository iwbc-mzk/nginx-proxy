services:
  proxy-nginx:
    image: nginx:stable
    pull_policy: always
    ports:
      - 80:80
      - 443:443
    restart: unless-stopped
    networks:
      - proxy-network
    volumes:
      - ./conf.d:/etc/nginx/conf.d
      - /ssl:/ssl/
      # for local develop
      # - C:/ssl/:/ssl/
      - /log:/var/log/nginx/proxy
networks:
  proxy-network:
    name: proxy-network
